name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Builders by following the released page
        env:
          RELEASE_TAG: build-${{ github.event.workflow_run.run_number }}
        run: |
          $page = Get-Content -Raw -LiteralPath site/index.md
          $latest = 'https://github.com/oddessentials/agent-guild-builders/releases/latest/download/AgentGuildBuilders-windows.zip'
          if (-not $page.Contains($latest)) { throw 'The page has no expected Windows download URL.' }
          $download = $latest.Replace('/latest/download/', "/download/$env:RELEASE_TAG/")
          $pagePath = Join-Path $env:RUNNER_TEMP 'released-page.md'
          Set-Content -LiteralPath $pagePath -Value $page.Replace($latest, $download)
          ./tests/site_check.ps1 -Page $pagePath

  deploy:
    if: github.event_name == 'workflow_run'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build the page
        run: python3 tools/make_site.py build/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the published page
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for file in index.md llms.txt; do
            for attempt in 1 2 3 4 5 6; do
              curl -fsS "${PAGE}${file}" -o "published-$file" && cmp -s "published-$file" "build/site/$file" && continue 2
              sleep 10
            done
            echo "::error::${PAGE}${file} doesn't match the built page."
            exit 1
          done
