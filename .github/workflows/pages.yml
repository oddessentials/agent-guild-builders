name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install Builders by following the released page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_run' && format('build-{0}', github.event.workflow_run.run_number) || '' }}
        run: |
          if (-not $env:RELEASE_TAG) {
            $env:RELEASE_TAG = gh api "repos/$env:GH_REPO/releases/latest" --jq .tag_name
            if ($LASTEXITCODE -ne 0 -or $env:RELEASE_TAG -notmatch '^build-[0-9]+$') { throw 'The latest release could not be read.' }
          }
          $page = Get-Content -Raw -LiteralPath site/index.md
          $latest = 'https://github.com/oddessentials/agent-guild-builders/releases/latest/download/AgentGuildBuilders-windows.zip'
          if (-not $page.Contains($latest)) { throw 'The page has no expected Windows download URL.' }
          $download = $latest.Replace('/latest/download/', "/download/$env:RELEASE_TAG/")
          $pagePath = Join-Path $env:RUNNER_TEMP 'released-page.md'
          Set-Content -LiteralPath $pagePath -Value $page.Replace($latest, $download)
          ./tests/site_check.ps1 -Page $pagePath

  deploy:
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build the page
        run: python3 tools/make_site.py build/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
          include-hidden-files: true
      - name: Verify the triggering release is still latest
        id: latest_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.event.workflow_run.run_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            if [ "$head" = "$GITHUB_SHA" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Skipping $GITHUB_SHA; main is now at $head."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping $RELEASE_TAG; the latest release is $latest."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        id: deployment
        if: steps.latest_release.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
      - name: Check the published page
        if: steps.latest_release.outputs.deploy == 'true'
        env:
          PAGE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for file in index.md llms.txt; do
            for attempt in 1 2 3 4 5 6; do
              curl -fsS "${PAGE}${file}" -o "published-$file" && cmp -s "published-$file" "build/site/$file" && continue 2
              sleep 10
            done
            echo "::error::${PAGE}${file} doesn't match the built page."
            exit 1
          done
